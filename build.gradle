plugins {
    id 'java'
    id 'application'
    id "com.diffplug.spotless" version "6.2.1"
}

version = '0.0.1-SNAPSHOT'
sourceCompatibility = '17'
targetCompatibility = '17'

spotless {
    java {
        target project.fileTree(project.rootDir) {
            include '**/*.java'
            exclude 'build/generated/**/*.*', 'build/generated-examples/**/*.*'
        }
        googleJavaFormat()
    }
}

repositories {
    mavenCentral()
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

def micronautPlatform = 'io.micronaut.platform:micronaut-platform:4.10.22'

dependencies {
    annotationProcessor 'org.projectlombok:lombok:1.18.42'
    annotationProcessor platform(micronautPlatform)
    annotationProcessor 'io.micronaut:micronaut-inject-java'

    implementation platform(micronautPlatform)
    implementation 'io.micronaut:micronaut-http-server-netty'
    implementation 'io.micronaut:micronaut-jackson-databind'
    implementation 'io.micronaut.sql:micronaut-jdbc-hikari'
    implementation 'org.hibernate.validator:hibernate-validator:8.0.2.Final'
    implementation 'org.mybatis:mybatis:3.5.9'
    implementation('org.flywaydb:flyway-core') { version { strictly '8.0.5' } }
    implementation('com.graphql-java:graphql-java') { version { strictly '17.3' } }
    implementation('io.jsonwebtoken:jjwt-api') { version { strictly '0.11.2' } }
    runtimeOnly('io.jsonwebtoken:jjwt-impl') { version { strictly '0.11.2' } }
    runtimeOnly('io.jsonwebtoken:jjwt-jackson') { version { strictly '0.11.2' } }
    implementation 'joda-time:joda-time:2.10.13'
    implementation 'org.xerial:sqlite-jdbc:3.36.0.3'
    implementation 'org.mindrot:jbcrypt:0.4'
    runtimeOnly 'ch.qos.logback:logback-classic'
    runtimeOnly 'org.yaml:snakeyaml'

    testAnnotationProcessor 'org.projectlombok:lombok:1.18.42'
    testAnnotationProcessor platform(micronautPlatform)
    testAnnotationProcessor 'io.micronaut:micronaut-inject-java'
    testCompileOnly 'org.projectlombok:lombok:1.18.42'
    testImplementation 'io.micronaut.test:micronaut-test-junit5'
    testImplementation 'io.micronaut:micronaut-http-client'
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.hamcrest:hamcrest'
    testImplementation 'io.rest-assured:rest-assured:4.5.1'
    testImplementation 'io.rest-assured:json-path:4.5.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'io.spring.RealWorldApplication'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-parameters')
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('clean') {
    doFirst {
        delete './dev.db'
    }
}
