micronaut:
  application:
    name: realworld
  server:
    port: ${SERVER_PORT:8080}
    thread-selection: blocking
    netty:
      compression-threshold: -1
    cors:
      localhost-pass-through: true

datasources:
  default:
    url: jdbc:sqlite:dev.db
    driver-class-name: org.sqlite.JDBC
    username: ''
    password: ''

jackson:
  bean-introspection-module: false
  serialization-inclusion: always
  deserialization:
    UNWRAP_ROOT_VALUE: true
    FAIL_ON_UNKNOWN_PROPERTIES: false
    ACCEPT_SINGLE_VALUE_AS_ARRAY: false
    UNWRAP_SINGLE_VALUE_ARRAYS: false
  serialization:
    WRITE_DATES_AS_TIMESTAMPS: false

image:
  default: https://static.productionready.io/images/smiley-cyrus.jpg

jwt:
  secret: nRvyYC4soFxBdZ-F-5Nnzz5USXstR1YylsTd-mA0aKtI9HUlriGrtkf-TiuDapkLiUCogO3JOK7kwZisrHp6wA
  session-time: 86400

mybatis:
  cache-enabled: true
  default-statement-timeout: 3000
  map-underscore-to-camel-case: true
  use-generated-keys: true
  type-handlers-package: io.spring.infrastructure.mybatis
  mapper-locations:
    - mapper/*.xml
